name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # CPU dependencies only. The GPU extra (CuPy) is deliberately omitted:
      # GitHub runners have no NVIDIA GPU, and the GPU tests importorskip cupy
      # and skip cleanly. uv reads .python-version and provisions CPython 3.12.
      - name: Install (CPU deps)
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
