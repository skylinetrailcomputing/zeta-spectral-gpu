[project]
name = "zeta-spectral-gpu"
version = "0.0.1"
description = "GPU/CUDA experiments on the spectral approach to the Riemann zeta zeros (forward problems only)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "mpmath>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# GPU stack. The dev box has a CUDA 13.2 *driver*, backward compatible with the
# 12.x runtime, so the cupy-cuda12x wheel is correct (verified: it detects the
# RTX 3090, CUDA runtime 12.9). The `[ctk]` extra is REQUIRED, not optional:
# CuPy 14.x JIT-compiles every kernel at runtime via NVRTC and needs the CUDA
# toolkit *headers*, which the bare wheel doesn't bundle. `[ctk]` supplies them
# as pip wheels — no system CUDA Toolkit install required.
gpu = ["cupy-cuda12x[ctk]"]

# Validation oracle (#16). connes-cvs (Groskin 2026) is the first public
# implementation of the Connes–van Suijlekom Galerkin matrix. Used as a
# dev/cross-check dependency ONLY — never imported at runtime: we diff our own
# forward numbers against it, we never fit to it. Opt-in like `gpu` so a plain
# `uv sync` (and CI) stays lean. `[fast]` pulls python-flint (Arb digamma,
# ~11x); λ_min is bit-identical with or without it, so [fast] is pure speed.
oracle = ["connes-cvs[fast]>=0.2.2"]

# CPU acceleration for the flagship multiprecision path (#17). gmpy2 swaps
# mpmath's pure-Python integer core for GMP: ~2x on every mpf op at dps~210, so
# ~2x on the eigensolve-dominated CCM run (and it stacks with the factor-once
# inverse iteration). Pure speed — mpmath auto-detects gmpy2 on import and the
# values are bit-identical with or without it. Optional like `gpu`/`oracle` so a
# plain `uv sync` and CI stay lean; enable with `uv sync --extra accel`.
accel = ["gmpy2>=2.1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
# `slow` guards long-running, opt-in tests: the connes-cvs oracle cross-checks
# (~minutes, need the `oracle` extra) and the heavier end-to-end statistics
# sweeps (e.g. deformed-xp vs the real zeros, #24). Deselected by default so
# `uv run pytest` and CI stay fast; run them with `uv run pytest -m slow`.
addopts = "-m 'not slow'"
markers = ["slow: long-running, opt-in tests (oracle cross-checks or stats sweeps)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeta_spectral_gpu"]
